name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Texte und Bilder liegen bereits im Repo (kommen per "npm run live" aus dem Vault)
      - run: npx astro build
        env:
          PUBLIC_NOINDEX: ${{ vars.PUBLIC_NOINDEX || 'true' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Hostinger: wird erst aktiv, wenn die Repository-Variable HOSTINGER_DEPLOY auf "true" steht
  # und die Secrets FTP_HOST, FTP_USER, FTP_PASSWORD gesetzt sind (optional Variable FTP_DIR, Standard public_html/).
  hostinger:
    needs: build
    if: ${{ vars.HOSTINGER_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
          # Zugangsdaten für Newsletter (Brevo) liegen nur auf dem Server und werden nie überschrieben oder gelöscht
          exclude: |
            **/api/config.php
